name: Notify Run Status

on:
  workflow_call:
    inputs:
      status:
        description: Job status to report (success, failure, cancelled)
        required: true
        type: string
      app-name:
        description: Name shown in the message. Defaults to owner/repo
        type: string
        default: ''
      title:
        description: Short headline for the message (e.g. "deployment", "release")
        type: string
        default: deployment
      message:
        description: Optional extra mrkdwn text appended on its own line
        type: string
        default: ''
      show-commit:
        description: Include branch + commit subject line
        type: boolean
        default: true
      run-url:
        description: URL the "View run" button links to
        type: string
        default: ''
    secrets:
      webhook-url:
        description: Slack incoming-webhook URL
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Get commit metadata
        id: commit
        if: inputs.show-commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SUBJECT=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}" --jq '.commit.message' | head -n1 | tr -d '"\\')
          echo "subject=${SUBJECT}" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build message text
        id: text
        run: |
          ICON=':x:'
          [ "${{ inputs.status }}" = "success" ] && ICON=':white_check_mark:'
          APP="${{ inputs.app-name != '' && inputs.app-name || github.repository }}"
          TEXT="${ICON} *${APP}* ${{ inputs.title }} ${{ inputs.status }}"
          if [ "${{ inputs.show-commit }}" = "true" ]; then
            LINK="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
            TEXT="${TEXT}\n*Branch:* ${{ github.ref_name }} | *Commit:* <${LINK}|${{ steps.commit.outputs.short }}>\n> ${{ steps.commit.outputs.subject }}"
          fi
          if [ -n "${{ inputs.message }}" ]; then
            TEXT="${TEXT}\n${{ inputs.message }}"
          fi
          echo "value=${TEXT}" >> "$GITHUB_OUTPUT"

      - name: Send to Slack
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.webhook-url }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ steps.text.outputs.value }}"
                  },
                  "accessory": {
                    "type": "button",
                    "text": { "type": "plain_text", "text": "View run" },
                    "url": "${{ inputs.run-url != '' && inputs.run-url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}"
                  }
                }
              ]
            }
